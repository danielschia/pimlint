name: report-html

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Smoke test the CLI
        run: |
          python -m pimlint --list-channels
          # o sample tem erros propositais: deve sair com 1
          python -m pimlint samples/products.csv --channel amazon || test $? -eq 1

      - name: Gerar relatório de exemplo
        run: |
          python -m pimlint samples/products.csv --channel amazon \
            --format html -o report.html || test $? -eq 1

      - name: Conferir que o relatório saiu completo
        run: |
          grep -q "</html>" report.html
          grep -q "Atributos que mais reprovam" report.html
          # nenhum recurso externo: sem <script src>, sem stylesheet link, sem CDN
          ! grep -q '<script src' report.html
          ! grep -q 'rel="stylesheet"' report.html
          ! grep -qE '(src|href)="https?://' report.html

      - name: Anexar relatório
        uses: actions/upload-artifact@v4
        with:
          name: feed-report-amazon
          path: report.html

  # Gera um relatório por canal e anexa todos como artifact do build.
  validate-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Gerar relatórios por canal
        run: |
          for channel in $(python -m pimlint --list-channels | awk '{print $1}'); do
            echo "== $channel"
            python -m pimlint samples/products.csv --channel "$channel" \
              --format html -o "report-$channel.html" || true
          done

      - name: Anexar relatórios
        uses: actions/upload-artifact@v4
        with:
          name: feed-reports
          path: report-*.html
